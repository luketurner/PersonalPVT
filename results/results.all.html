<h4>{{ 'results.all.mean_heading' | translate }} </h4>
<div class="scatter-plot"><scatter-plot data="meanData" options="chartSettings"></scatter-plot></div>

<h4>{{ 'results.all.lapses_heading_prefix' | translate }} <span class="mini-btn"><span ng-click="modifyThreshold(-100)">←</span><span ng-click="modifyThreshold(100)">{{ lapseThreshold }}ms→</span></span></h4>
<div class="scatter-plot"><scatter-plot data="lapseData" options="chartSettings"></scatter-plot></div>

<div class="row choices">
    <div class="col-xs-4"><a ui-sref="home">{{ 'nav.short_back' | translate }}</a></div>
    <div class="col-xs-4"><delete-all on-delete="reallyDelete()"></delete-all></div>
    <div class="col-xs-4"><a ng-href="{{ downloadUrl }}" download="results_all.csv" target="_self">{{ 'nav.download_all' | translate }}</a></div>
</div>
