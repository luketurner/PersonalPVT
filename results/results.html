<h1>{{ 'results.title' | translate }}</h1>

<div class="col-sm-4">
    <ul class="list-unstyled result-list">
        <li ng-if="trials.length > 1">
            <a ui-sref=".all" ui-sref-active="active">{{ 'nav.compare_all' | translate }}</a>
            <p> {{ trials.length }} {{ 'results.trials_summary_prefix' | translate }} {{ getDateSpan(trials) }} {{ 'results.trials_summary_suffix' | translate }}</p>
        </li>
        <li ng-repeat="(index, trial) in trials.toReversed()">
            <a ui-sref=".trial({ trialId: idForTrial(trial) })" ui-sref-active="active"> {{ titleForTrial(trial) }} </a>
            <p>{{ textForTrial(trial) }}</p>
        </li>
    </ul>
</div>
<div ui-view class="col-sm-8"></div>
